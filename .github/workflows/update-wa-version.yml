name: Auto Update WA Version

on:
  schedule:
    # A cada 3 horas — heartbeat semanal evita o disable por inatividade (60 dias)
    - cron: "13 */3 * * *"
  workflow_dispatch:

concurrency:
  group: update-wa-version
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/script/update-baileys-version.mjs
